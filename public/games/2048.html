<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>2048</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; overflow: hidden; }
    .header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .title-box h1 { font-size: 36px; font-weight: 800; color: #fbbf24; line-height: 1; }
    .title-box p { font-size: 13px; color: #94a3b8; }
    .scores { display: flex; gap: 8px; }
    .score-card { background: #1e293b; border: 1px solid #334155; padding: 6px 14px; border-radius: 8px; text-align: center; min-width: 70px; }
    .score-label { font-size: 10px; text-transform: uppercase; color: #94a3b8; letter-spacing: 0.5px; }
    .score-value { font-size: 18px; font-weight: 700; color: #ffffff; }
    .controls { width: 100%; max-width: 400px; display: flex; justify-content: space-between; margin-bottom: 14px; align-items: center; }
    .btn { background: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 13px; }
    .btn:hover { background: #2563eb; transform: translateY(-1px); }
    .instructions { font-size: 12px; color: #64748b; }
    #grid-container {
      width: 100%; max-width: 400px; height: 400px; background: #1e293b; border-radius: 12px;
      padding: 12px; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr);
      gap: 12px; position: relative; border: 2px solid #334155; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
    }
    .grid-cell { background: #0f172a; border-radius: 8px; }
    .tile {
      position: absolute; width: calc((100% - 60px) / 4); height: calc((100% - 60px) / 4);
      border-radius: 8px; font-weight: 700; display: flex; align-items: center; justify-content: center;
      transition: transform 120ms ease, background-color 120ms ease; font-size: 28px;
    }
    .tile-2 { background: #334155; color: #f8fafc; }
    .tile-4 { background: #475569; color: #f8fafc; }
    .tile-8 { background: #ea580c; color: #ffffff; font-size: 26px; }
    .tile-16 { background: #f97316; color: #ffffff; font-size: 26px; }
    .tile-32 { background: #ef4444; color: #ffffff; font-size: 26px; }
    .tile-64 { background: #dc2626; color: #ffffff; font-size: 26px; }
    .tile-128 { background: #eab308; color: #000000; font-size: 24px; box-shadow: 0 0 10px #eab308; }
    .tile-256 { background: #facc15; color: #000000; font-size: 24px; box-shadow: 0 0 12px #facc15; }
    .tile-518, .tile-512 { background: #84cc16; color: #000000; font-size: 24px; box-shadow: 0 0 14px #84cc16; }
    .tile-1024 { background: #06b6d4; color: #ffffff; font-size: 20px; box-shadow: 0 0 16px #06b6d4; }
    .tile-2048 { background: #8b5cf6; color: #ffffff; font-size: 20px; box-shadow: 0 0 20px #8b5cf6; }
    .overlay {
      position: absolute; inset: 0; background: rgba(15, 23, 42, 0.9); border-radius: 12px;
      display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      z-index: 10;
    }
    .overlay.active { display: flex; }
    .overlay h2 { font-size: 32px; font-weight: 800; color: #f8fafc; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-box">
      <h1>2048</h1>
      <p>Join tiles to reach 2048!</p>
    </div>
    <div class="scores">
      <div class="score-card">
        <div class="score-label">Score</div>
        <div class="score-value" id="score">0</div>
      </div>
      <div class="score-card">
        <div class="score-label">Best</div>
        <div class="score-value" id="best">0</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <span class="instructions">Use Arrow Keys, WASD, or Swipe</span>
    <button class="btn" id="new-game-btn">New Game</button>
  </div>

  <div id="grid-container">
    <!-- 16 background cells -->
    <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
    <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
    <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
    <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>

    <div class="overlay" id="game-over-overlay">
      <h2 id="overlay-title">Game Over!</h2>
      <button class="btn" id="retry-btn">Try Again</button>
    </div>
  </div>

  <script>
    let board = Array(4).fill(null).map(() => Array(4).fill(0));
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('2048_best') || '0', 10);
    document.getElementById('best').textContent = bestScore;

    const container = document.getElementById('grid-container');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('game-over-overlay');
    const overlayTitle = document.getElementById('overlay-title');

    function init() {
      board = Array(4).fill(null).map(() => Array(4).fill(0));
      score = 0;
      updateScore(0);
      overlay.classList.remove('active');
      addRandomTile();
      addRandomTile();
      render();
    }

    function addRandomTile() {
      const empty = [];
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (board[r][c] === 0) empty.push({ r, c });
        }
      }
      if (empty.length === 0) return;
      const { r, c } = empty[Math.floor(Math.random() * empty.length)];
      board[r][c] = Math.random() < 0.9 ? 2 : 4;
    }

    function render() {
      const existingTiles = container.querySelectorAll('.tile');
      existingTiles.forEach(t => t.remove());

      const size = (container.clientWidth - 24 - 36) / 4;
      const gap = 12;

      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          const val = board[r][c];
          if (val > 0) {
            const tile = document.createElement('div');
            tile.className = `tile tile-${val > 2048 ? '2048' : val}`;
            tile.textContent = val;
            const top = 12 + r * (size + gap);
            const left = 12 + c * (size + gap);
            tile.style.top = top + 'px';
            tile.style.left = left + 'px';
            tile.style.width = size + 'px';
            tile.style.height = size + 'px';
            container.appendChild(tile);
          }
        }
      }
    }

    function updateScore(add) {
      score += add;
      scoreEl.textContent = score;
      if (score > bestScore) {
        bestScore = score;
        bestEl.textContent = bestScore;
        localStorage.setItem('2048_best', bestScore.toString());
      }
    }

    function slide(row) {
      let filtered = row.filter(val => val > 0);
      for (let i = 0; i < filtered.length - 1; i++) {
        if (filtered[i] === filtered[i + 1]) {
          filtered[i] *= 2;
          updateScore(filtered[i]);
          filtered[i + 1] = 0;
        }
      }
      filtered = filtered.filter(val => val > 0);
      while (filtered.length < 4) filtered.push(0);
      return filtered;
    }

    function moveLeft() {
      let moved = false;
      for (let r = 0; r < 4; r++) {
        const old = [...board[r]];
        board[r] = slide(board[r]);
        if (old.some((v, i) => v !== board[r][i])) moved = true;
      }
      return moved;
    }

    function moveRight() {
      let moved = false;
      for (let r = 0; r < 4; r++) {
        const old = [...board[r]];
        board[r] = slide(board[r].reverse()).reverse();
        if (old.some((v, i) => v !== board[r][i])) moved = true;
      }
      return moved;
    }

    function moveUp() {
      let moved = false;
      for (let c = 0; c < 4; c++) {
        const col = [board[0][c], board[1][c], board[2][c], board[3][c]];
        const next = slide(col);
        for (let r = 0; r < 4; r++) {
          if (board[r][c] !== next[r]) {
            board[r][c] = next[r];
            moved = true;
          }
        }
      }
      return moved;
    }

    function moveDown() {
      let moved = false;
      for (let c = 0; c < 4; c++) {
        const col = [board[3][c], board[2][c], board[1][c], board[0][c]];
        const next = slide(col);
        for (let r = 0; r < 4; r++) {
          if (board[3 - r][c] !== next[r]) {
            board[3 - r][c] = next[r];
            moved = true;
          }
        }
      }
      return moved;
    }

    function canMove() {
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (board[r][c] === 0) return true;
          if (c < 3 && board[r][c] === board[r][c + 1]) return true;
          if (r < 3 && board[r][c] === board[r + 1][c]) return true;
        }
      }
      return false;
    }

    function checkWin() {
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (board[r][c] === 2048) return true;
        }
      }
      return false;
    }

    function handleInput(dir) {
      let moved = false;
      if (dir === 'left') moved = moveLeft();
      if (dir === 'right') moved = moveRight();
      if (dir === 'up') moved = moveUp();
      if (dir === 'down') moved = moveDown();

      if (moved) {
        addRandomTile();
        render();
        if (!canMove()) {
          overlayTitle.textContent = "Game Over!";
          overlay.classList.add('active');
        }
      }
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); handleInput('up'); }
      if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); handleInput('down'); }
      if (['ArrowLeft', 'KeyA'].includes(e.code)) { e.preventDefault(); handleInput('left'); }
      if (['ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); handleInput('right'); }
    });

    let touchStartX = 0, touchStartY = 0;
    window.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.hypot(dx, dy) < 25) return;
      if (Math.abs(dx) > Math.abs(dy)) {
        handleInput(dx > 0 ? 'right' : 'left');
      } else {
        handleInput(dy > 0 ? 'down' : 'up');
      }
    });

    document.getElementById('new-game-btn').addEventListener('click', init);
    document.getElementById('retry-btn').addEventListener('click', init);
    window.addEventListener('resize', render);
    init();
  </script>
</body>
</html>
