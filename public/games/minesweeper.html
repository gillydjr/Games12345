<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Minesweeper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    body { background: #090d16; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 12px; }
    .window { background: #1e293b; border: 2px solid #475569; border-radius: 12px; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); max-width: 360px; width: 100%; }
    .header { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 10px 16px; border-radius: 8px; margin-bottom: 14px; border: 1px solid #334155; }
    .counter { font-family: monospace; font-size: 22px; font-weight: 700; color: #ef4444; background: #030712; padding: 4px 10px; border-radius: 4px; border: 1px solid #1e293b; min-width: 60px; text-align: center; }
    .face-btn { font-size: 24px; background: #334155; border: 1px solid #64748b; border-radius: 6px; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .face-btn:hover { background: #475569; }
    .board { display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; background: #0f172a; padding: 6px; border-radius: 8px; border: 1px solid #334155; }
    .cell {
      aspect-ratio: 1; background: #334155; border-radius: 4px; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 16px; cursor: pointer; border: 1px solid #475569; transition: background 0.1s;
    }
    .cell:hover { background: #475569; }
    .cell.revealed { background: #0f172a; border-color: #1e293b; cursor: default; }
    .cell.mine { background: #ef4444 !important; }
    .cell.c-1 { color: #38bdf8; }
    .cell.c-2 { color: #4ade80; }
    .cell.c-3 { color: #f87171; }
    .cell.c-4 { color: #818cf8; }
    .cell.c-5 { color: #fbbf24; }
    .cell.c-6 { color: #2dd4bf; }
    .footer { margin-top: 12px; font-size: 12px; color: #64748b; text-align: center; display: flex; justify-content: space-between; }
    .flag-mode-btn { background: #334155; color: white; border: 1px solid #475569; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
    .flag-mode-btn.active { background: #ef4444; border-color: #ef4444; }
  </style>
</head>
<body>
  <div class="window">
    <div class="header">
      <div class="counter" id="mines-count">010</div>
      <button class="face-btn" id="face">🙂</button>
      <div class="counter" id="timer">000</div>
    </div>

    <div class="board" id="board"></div>

    <div class="footer">
      <span>Right Click to Flag</span>
      <button class="flag-mode-btn" id="toggle-flag">🚩 Flag Mode: OFF</button>
    </div>
  </div>

  <script>
    const ROWS = 9;
    const COLS = 9;
    const MINES = 10;

    let grid = [];
    let revealedCount = 0;
    let flagsLeft = MINES;
    let timer = 0;
    let timerInterval = null;
    let gameOver = false;
    let firstClick = true;
    let flagMode = false;

    const boardEl = document.getElementById('board');
    const minesCountEl = document.getElementById('mines-count');
    const timerEl = document.getElementById('timer');
    const faceEl = document.getElementById('face');
    const toggleFlagBtn = document.getElementById('toggle-flag');

    function initGame() {
      grid = [];
      revealedCount = 0;
      flagsLeft = MINES;
      timer = 0;
      gameOver = false;
      firstClick = true;
      faceEl.textContent = '🙂';
      minesCountEl.textContent = String(flagsLeft).padStart(3, '0');
      timerEl.textContent = '000';
      if (timerInterval) clearInterval(timerInterval);

      boardEl.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        const row = [];
        for (let c = 0; c < COLS; c++) {
          const cell = {
            r, c,
            isMine: false,
            revealed: false,
            flagged: false,
            count: 0,
            el: document.createElement('div')
          };
          cell.el.className = 'cell';
          cell.el.addEventListener('click', () => handleClick(r, c));
          cell.el.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            handleRightClick(r, c);
          });
          boardEl.appendChild(cell.el);
          row.push(cell);
        }
        grid.push(row);
      }
    }

    function plantMines(safeR, safeC) {
      let planted = 0;
      while (planted < MINES) {
        const r = Math.floor(Math.random() * ROWS);
        const c = Math.floor(Math.random() * COLS);
        if ((r === safeR && c === safeC) || grid[r][c].isMine) continue;
        grid[r][c].isMine = true;
        planted++;
      }

      // Calculate counts
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c].isMine) continue;
          let count = 0;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              const nr = r + dr, nc = c + dc;
              if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc].isMine) {
                count++;
              }
            }
          }
          grid[r][c].count = count;
        }
      }

      timerInterval = setInterval(() => {
        timer++;
        timerEl.textContent = String(Math.min(999, timer)).padStart(3, '0');
      }, 1000);
    }

    function handleClick(r, c) {
      if (gameOver) return;
      if (flagMode) {
        handleRightClick(r, c);
        return;
      }

      const cell = grid[r][c];
      if (cell.flagged || cell.revealed) return;

      if (firstClick) {
        firstClick = false;
        plantMines(r, c);
      }

      if (cell.isMine) {
        revealMines();
        cell.el.textContent = '💥';
        cell.el.classList.add('mine');
        faceEl.textContent = '😵';
        gameOver = true;
        clearInterval(timerInterval);
        return;
      }

      revealCell(r, c);

      if (revealedCount === ROWS * COLS - MINES) {
        faceEl.textContent = '😎';
        gameOver = true;
        clearInterval(timerInterval);
      }
    }

    function revealCell(r, c) {
      const cell = grid[r][c];
      if (cell.revealed || cell.flagged) return;

      cell.revealed = true;
      cell.el.classList.add('revealed');
      revealedCount++;

      if (cell.count > 0) {
        cell.el.textContent = cell.count;
        cell.el.classList.add(`c-${cell.count}`);
      } else {
        // Expand blank area
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
              revealCell(nr, nc);
            }
          }
        }
      }
    }

    function handleRightClick(r, c) {
      if (gameOver) return;
      const cell = grid[r][c];
      if (cell.revealed) return;

      cell.flagged = !cell.flagged;
      cell.el.textContent = cell.flagged ? '🚩' : '';
      flagsLeft += cell.flagged ? -1 : 1;
      minesCountEl.textContent = String(flagsLeft).padStart(3, '0');
    }

    function revealMines() {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c].isMine) {
            grid[r][c].el.textContent = '💣';
            grid[r][c].el.classList.add('revealed');
          }
        }
      }
    }

    faceEl.addEventListener('click', initGame);

    toggleFlagBtn.addEventListener('click', () => {
      flagMode = !flagMode;
      toggleFlagBtn.classList.toggle('active', flagMode);
      toggleFlagBtn.textContent = `🚩 Flag Mode: ${flagMode ? 'ON' : 'OFF'}`;
    });

    initGame();
  </script>
</body>
</html>
