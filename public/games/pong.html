<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Retro Pong</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    body { background: #080c18; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 12px; overflow: hidden; }
    .header { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .title-box h1 { font-size: 26px; font-weight: 800; color: #3b82f6; line-height: 1; }
    .title-box p { font-size: 13px; color: #94a3b8; }
    .mode-select { display: flex; gap: 6px; }
    .mode-btn { background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 4px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; }
    .mode-btn.active { background: #3b82f6; color: white; border-color: #3b82f6; }
    .canvas-wrap { position: relative; width: 100%; max-width: 480px; height: 320px; background: #020617; border: 2px solid #334155; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
    canvas { width: 100%; height: 100%; display: block; }
    .overlay { position: absolute; inset: 0; background: rgba(2, 6, 23, 0.88); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; backdrop-filter: blur(4px); }
    .overlay h2 { font-size: 30px; font-weight: 800; color: #f8fafc; }
    .overlay p { font-size: 14px; color: #94a3b8; }
    .btn { background: #3b82f6; color: white; border: none; padding: 10px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: all 0.2s; font-size: 14px; }
    .btn:hover { background: #60a5fa; transform: translateY(-1px); }
    .controls { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-box">
      <h1>Classic Pong</h1>
      <p>Table tennis arcade duel</p>
    </div>
    <div class="mode-select">
      <button class="mode-btn active" id="btn-ai">vs AI</button>
      <button class="mode-btn" id="btn-2p">2-Player</button>
    </div>
  </div>

  <div class="canvas-wrap">
    <canvas id="gameCanvas" width="480" height="320"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlay-msg">Classic Pong</h2>
      <p id="overlay-sub">First to 7 points wins!</p>
      <button class="btn" id="start-btn">Start Match</button>
    </div>
  </div>

  <div class="controls" id="controls-hint">
    <span>P1: W / S or Mouse</span>
    <span>P2: Up / Down Arrows</span>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayMsg = document.getElementById('overlay-msg');
    const overlaySub = document.getElementById('overlay-sub');
    const startBtn = document.getElementById('start-btn');
    const btnAi = document.getElementById('btn-ai');
    const btn2p = document.getElementById('btn-2p');

    let mode = 'ai'; // 'ai' or '2p'
    let p1 = { y: 120, h: 60, w: 10, score: 0, speed: 5 };
    let p2 = { y: 120, h: 60, w: 10, score: 0, speed: 4.5 };
    let ball = { x: 240, y: 160, r: 6, vx: 4, vy: 3 };
    let running = false;

    // Keys
    const keys = {};

    // SFX
    const audioCtx = window.AudioContext ? new (window.AudioContext || window.webkitAudioContext)() : null;
    function playBeep(freq, type, dur) {
      if (!audioCtx) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    function resetBall(servingToP2 = true) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      const angle = (Math.random() * 0.8 - 0.4) * Math.PI;
      const speed = 4.5;
      ball.vx = (servingToP2 ? speed : -speed) * Math.cos(angle);
      ball.vy = speed * Math.sin(angle);
    }

    function startMatch() {
      p1.score = 0;
      p2.score = 0;
      p1.y = 120;
      p2.y = 120;
      resetBall(Math.random() > 0.5);
      running = true;
      overlay.style.display = 'none';
    }

    function gameOver(winner) {
      running = false;
      playBeep(winner === 'Player 1' ? 620 : 180, 'triangle', 0.4);
      overlayMsg.textContent = `${winner} Wins!`;
      overlaySub.textContent = `Final Score: ${p1.score} - ${p2.score}`;
      startBtn.textContent = 'Rematch';
      overlay.style.display = 'flex';
    }

    function update() {
      if (!running) return;

      // P1 input
      if (keys['KeyW']) p1.y -= p1.speed;
      if (keys['KeyS']) p1.y += p1.speed;

      // P2 input or AI
      if (mode === '2p') {
        if (keys['ArrowUp']) p2.y -= p2.speed;
        if (keys['ArrowDown']) p2.y += p2.speed;
      } else {
        // AI Logic with slight human delay
        const targetY = ball.y - p2.h / 2;
        if (ball.vx > 0) {
          if (p2.y + p2.h / 2 < ball.y - 10) p2.y += p2.speed * 0.85;
          else if (p2.y + p2.h / 2 > ball.y + 10) p2.y -= p2.speed * 0.85;
        }
      }

      // Constrain paddles
      p1.y = Math.max(0, Math.min(canvas.height - p1.h, p1.y));
      p2.y = Math.max(0, Math.min(canvas.height - p2.h, p2.y));

      // Ball move
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Top/Bottom bounce
      if (ball.y - ball.r <= 0) {
        ball.y = ball.r;
        ball.vy = -ball.vy;
        playBeep(340, 'sine', 0.04);
      }
      if (ball.y + ball.r >= canvas.height) {
        ball.y = canvas.height - ball.r;
        ball.vy = -ball.vy;
        playBeep(340, 'sine', 0.04);
      }

      // P1 paddle hit
      if (
        ball.x - ball.r <= 20 + p1.w &&
        ball.x + ball.r >= 20 &&
        ball.y >= p1.y &&
        ball.y <= p1.y + p1.h
      ) {
        const hitOffset = (ball.y - (p1.y + p1.h / 2)) / (p1.h / 2);
        const speed = Math.min(8.5, Math.hypot(ball.vx, ball.vy) * 1.05);
        const angle = hitOffset * (Math.PI / 3);
        ball.vx = Math.abs(speed * Math.cos(angle));
        ball.vy = speed * Math.sin(angle);
        ball.x = 20 + p1.w + ball.r;
        playBeep(480, 'square', 0.06);
      }

      // P2 paddle hit
      if (
        ball.x + ball.r >= canvas.width - 20 - p2.w &&
        ball.x - ball.r <= canvas.width - 20 &&
        ball.y >= p2.y &&
        ball.y <= p2.y + p2.h
      ) {
        const hitOffset = (ball.y - (p2.y + p2.h / 2)) / (p2.h / 2);
        const speed = Math.min(8.5, Math.hypot(ball.vx, ball.vy) * 1.05);
        const angle = hitOffset * (Math.PI / 3);
        ball.vx = -Math.abs(speed * Math.cos(angle));
        ball.vy = speed * Math.sin(angle);
        ball.x = canvas.width - 20 - p2.w - ball.r;
        playBeep(480, 'square', 0.06);
      }

      // Scores
      if (ball.x < 0) {
        p2.score++;
        playBeep(240, 'sawtooth', 0.15);
        if (p2.score >= 7) {
          gameOver(mode === 'ai' ? 'Computer' : 'Player 2');
        } else {
          resetBall(true);
        }
      } else if (ball.x > canvas.width) {
        p1.score++;
        playBeep(640, 'sine', 0.15);
        if (p1.score >= 7) {
          gameOver('Player 1');
        } else {
          resetBall(false);
        }
      }
    }

    function render() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center dashed line
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 3;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Scores
      ctx.fillStyle = '#334155';
      ctx.font = '700 48px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(p1.score, canvas.width / 2 - 60, 60);
      ctx.fillText(p2.score, canvas.width / 2 + 60, 60);

      // Paddles
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(20, p1.y, p1.w, p1.h);
      ctx.fillStyle = '#f43f5e';
      ctx.fillRect(canvas.width - 20 - p2.w, p2.y, p2.w, p2.h);

      // Ball
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', e => { keys[e.code] = true; });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    canvas.addEventListener('pointermove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseY = ((e.clientY - rect.top) / rect.height) * canvas.height;
      p1.y = mouseY - p1.h / 2;
    });

    btnAi.addEventListener('click', () => {
      mode = 'ai';
      btnAi.classList.add('active');
      btn2p.classList.remove('active');
    });

    btn2p.addEventListener('click', () => {
      mode = '2p';
      btn2p.classList.add('active');
      btnAi.classList.remove('active');
    });

    startBtn.addEventListener('click', startMatch);
    loop();
  </script>
</body>
</html>
