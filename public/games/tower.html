<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tower Stack</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    body { background: #070a14; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 12px; overflow: hidden; }
    .header { width: 100%; max-width: 380px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .title-box h1 { font-size: 26px; font-weight: 800; color: #38bdf8; line-height: 1; }
    .title-box p { font-size: 13px; color: #94a3b8; }
    .scores { display: flex; gap: 8px; }
    .score-card { background: #1e293b; border: 1px solid #334155; padding: 6px 12px; border-radius: 8px; text-align: center; min-width: 65px; }
    .score-label { font-size: 10px; text-transform: uppercase; color: #94a3b8; }
    .score-value { font-size: 18px; font-weight: 700; color: #ffffff; }
    .canvas-wrap { position: relative; width: 100%; max-width: 380px; height: 460px; background: #020617; border: 2px solid #334155; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
    canvas { width: 100%; height: 100%; display: block; }
    .overlay { position: absolute; inset: 0; background: rgba(2, 6, 23, 0.88); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; backdrop-filter: blur(4px); }
    .overlay h2 { font-size: 30px; font-weight: 800; color: #f8fafc; }
    .overlay p { font-size: 14px; color: #94a3b8; }
    .btn { background: #38bdf8; color: #082f49; border: none; padding: 10px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: all 0.2s; font-size: 14px; }
    .btn:hover { background: #7dd3fc; transform: translateY(-1px); }
    .controls { width: 100%; max-width: 380px; display: flex; justify-content: center; margin-top: 10px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-box">
      <h1>Tower Stack</h1>
      <p>Stack blocks as high as possible!</p>
    </div>
    <div class="scores">
      <div class="score-card">
        <div class="score-label">Height</div>
        <div class="score-value" id="score">0</div>
      </div>
      <div class="score-card">
        <div class="score-label">Best</div>
        <div class="score-value" id="best">0</div>
      </div>
    </div>
  </div>

  <div class="canvas-wrap" id="canvas-wrap">
    <canvas id="gameCanvas" width="380" height="460"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlay-msg">Tower Stack</h2>
      <p id="overlay-sub">Click, Tap, or Press Space to place block</p>
      <button class="btn" id="start-btn">Start Game</button>
    </div>
  </div>

  <div class="controls">
    <span>Tap / Click / Space to place block</span>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const overlayMsg = document.getElementById('overlay-msg');
    const overlaySub = document.getElementById('overlay-sub');
    const startBtn = document.getElementById('start-btn');
    const canvasWrap = document.getElementById('canvas-wrap');

    let best = parseInt(localStorage.getItem('tower_best') || '0', 10);
    bestEl.textContent = best;

    const BLOCK_HEIGHT = 22;
    let stack = [];
    let currentBlock = null;
    let direction = 1;
    let speed = 3.2;
    let score = 0;
    let cameraY = 0;
    let targetCameraY = 0;
    let running = false;

    // SFX
    const audioCtx = window.AudioContext ? new (window.AudioContext || window.webkitAudioContext)() : null;
    function playBeep(freq, type, dur) {
      if (!audioCtx) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    const COLORS = [
      '#ef4444', '#f97316', '#f59e0b', '#10b981', '#06b6d4', '#3b82f6', '#8b5cf6', '#ec4899'
    ];

    function getColor(index) {
      return COLORS[index % COLORS.length];
    }

    function initGame() {
      stack = [
        { x: 90, y: canvas.height - 40, w: 200, color: getColor(0) }
      ];
      score = 0;
      speed = 3.2;
      direction = 1;
      cameraY = 0;
      targetCameraY = 0;
      scoreEl.textContent = '0';
      spawnBlock();
      running = true;
      overlay.style.display = 'none';
    }

    function spawnBlock() {
      const topBlock = stack[stack.length - 1];
      currentBlock = {
        x: 0,
        y: topBlock.y - BLOCK_HEIGHT,
        w: topBlock.w,
        color: getColor(stack.length)
      };
      direction = 1;
      speed = 3.2 + Math.min(6, score * 0.12);
    }

    function placeBlock() {
      if (!running) {
        initGame();
        return;
      }

      const topBlock = stack[stack.length - 1];
      const diff = currentBlock.x - topBlock.x;

      if (Math.abs(diff) <= 3) {
        // Perfect drop!
        currentBlock.x = topBlock.x;
        stack.push(currentBlock);
        score++;
        playBeep(680 + (score % 8) * 40, 'triangle', 0.15);
      } else if (diff > 0 && diff < topBlock.w) {
        // Slice right
        currentBlock.w -= diff;
        stack.push(currentBlock);
        score++;
        playBeep(440 + (score % 8) * 30, 'sine', 0.1);
      } else if (diff < 0 && -diff < topBlock.w) {
        // Slice left
        currentBlock.w += diff;
        currentBlock.x = topBlock.x;
        stack.push(currentBlock);
        score++;
        playBeep(440 + (score % 8) * 30, 'sine', 0.1);
      } else {
        // Miss!
        gameOver();
        return;
      }

      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        localStorage.setItem('tower_best', best.toString());
      }

      if (currentBlock.y - targetCameraY < 180) {
        targetCameraY = currentBlock.y - 180;
      }

      spawnBlock();
    }

    function gameOver() {
      running = false;
      playBeep(180, 'sawtooth', 0.3);
      overlayMsg.textContent = 'Tower Collapsed!';
      overlaySub.textContent = `Height: ${score} floors | Best: ${best}`;
      startBtn.textContent = 'Stack Again';
      overlay.style.display = 'flex';
    }

    function update() {
      if (!running) return;

      cameraY += (targetCameraY - cameraY) * 0.1;

      currentBlock.x += speed * direction;
      if (currentBlock.x + currentBlock.w >= canvas.width) {
        currentBlock.x = canvas.width - currentBlock.w;
        direction = -1;
      } else if (currentBlock.x <= 0) {
        currentBlock.x = 0;
        direction = 1;
      }
    }

    function render() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(0, -cameraY);

      // Stacked blocks
      stack.forEach((b) => {
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.w, BLOCK_HEIGHT);
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(b.x, b.y, b.w, 3);
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.fillRect(b.x, b.y + BLOCK_HEIGHT - 3, b.w, 3);
      });

      // Active moving block
      if (running && currentBlock) {
        ctx.fillStyle = currentBlock.color;
        ctx.fillRect(currentBlock.x, currentBlock.y, currentBlock.w, BLOCK_HEIGHT);
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.fillRect(currentBlock.x, currentBlock.y, currentBlock.w, 3);
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.fillRect(currentBlock.x, currentBlock.y + BLOCK_HEIGHT - 3, currentBlock.w, 3);
      }

      ctx.restore();
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        placeBlock();
      }
    });

    canvasWrap.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      placeBlock();
    });

    startBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      initGame();
    });

    loop();
  </script>
</body>
</html>
